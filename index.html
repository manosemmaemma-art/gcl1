<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,date=no,email=no,address=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f0ece5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070605" media="(prefers-color-scheme: dark)">
<title>Gritcore</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{min-height:100dvh;overscroll-behavior:none;}
body{font-family:'Josefin Sans',sans-serif;color:var(--ct);background:var(--bg);transition:background .6s;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;}
:root{
  --gold:#D4AA50;--goldb:rgba(212,170,80,.12);--goldbor:rgba(212,170,80,.3);
  --blood:#C02020;--bloodb:rgba(192,32,32,.14);--bloodbor:rgba(192,32,32,.32);
  --ct:#f0ece6;--cts:#c0b8ac;--ctd:#a09890;--ctdd:#c0b8b0;--cthi:#f5f2ec;
  --cs:rgba(28,24,18,.82);--cs2:rgba(24,20,14,.78);
  --cbor:rgba(255,255,255,.09);--cborl:rgba(255,255,255,.045);
  --cnb:rgba(7,6,4,.98);--cnbbor:rgba(212,170,80,.09);
  --chdr:rgba(7,6,4,.97);
  --hm1:rgba(212,170,80,.1);--hm2:rgba(212,170,80,.25);--hm3:rgba(212,170,80,.48);--hm4:rgba(212,170,80,.72);
  --ts:none;
  --card-shadow:0 1px 4px rgba(0,0,0,.4),0 2px 10px rgba(0,0,0,.25);
  --gold-true:#c9a84c;--gold-glow:rgba(201,168,76,.35);
  --bg:#0a0806;
  --sp-xs:4px; --sp-sm:8px; --sp-md:16px; --sp-lg:24px; --sp-xl:32px;
}


/* Fire animations */
@keyframes f1{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.85;transform:scale(1.04)}}
@keyframes f2{0%,100%{transform:scale(1);filter:drop-shadow(0 0 2px rgba(251,191,36,.25))}50%{transform:scale(1.06);filter:drop-shadow(0 0 5px rgba(251,191,36,.4))}}
@keyframes f3{0%,100%{transform:scale(1);filter:drop-shadow(0 0 3px rgba(245,158,11,.35))}50%{transform:scale(1.08) translateY(-1px);filter:drop-shadow(0 0 7px rgba(245,158,11,.55))}}
@keyframes f4{0%,100%{transform:scale(1);filter:drop-shadow(0 0 4px rgba(245,158,11,.4))}40%{transform:scale(1.1) rotate(-1.5deg);filter:drop-shadow(0 0 10px rgba(245,158,11,.62))}60%{transform:scale(1.09) rotate(1.5deg)}}
@keyframes f5{0%,100%{transform:scale(1);filter:drop-shadow(0 0 6px rgba(240,112,32,.5))}40%{transform:scale(1.13) rotate(-2.5deg) translateY(-1px);filter:drop-shadow(0 0 14px rgba(240,112,32,.72))}60%{transform:scale(1.11) rotate(2.5deg) translateY(-1px)}}
@keyframes f6{0%,100%{transform:scale(1);filter:drop-shadow(0 0 7px rgba(234,88,12,.55))}35%{transform:scale(1.16) rotate(-3deg) translateY(-2px);filter:drop-shadow(0 0 16px rgba(234,88,12,.78))}65%{transform:scale(1.13) rotate(3deg) translateY(-1px)}}
@keyframes f7{0%,100%{transform:scale(1);filter:drop-shadow(0 0 8px rgba(224,72,24,.6)) drop-shadow(0 -2px 5px rgba(251,146,60,.35))}35%{transform:scale(1.18) rotate(-3.5deg) translateY(-2px);filter:drop-shadow(0 0 18px rgba(224,72,24,.85)) drop-shadow(0 -4px 10px rgba(251,146,60,.55))}65%{transform:scale(1.15) rotate(3.5deg)}}
@keyframes f8{0%,100%{transform:scale(1);filter:drop-shadow(0 0 10px rgba(204,48,16,.65)) drop-shadow(0 -3px 7px rgba(251,146,60,.4))}30%{transform:scale(1.2) rotate(-4deg) translateY(-3px);filter:drop-shadow(0 0 22px rgba(204,48,16,.9)) drop-shadow(0 -6px 12px rgba(251,146,60,.6))}70%{transform:scale(1.17) rotate(4deg) translateY(-2px)}}
@keyframes f9{0%,100%{transform:scale(1);filter:drop-shadow(0 0 10px rgba(185,28,28,.65)) drop-shadow(0 -4px 8px rgba(251,146,60,.45))}25%{transform:scale(1.22) rotate(-5deg) translateY(-3px);filter:drop-shadow(0 0 24px rgba(185,28,28,.95)) drop-shadow(0 -7px 14px rgba(251,146,60,.68))}75%{transform:scale(1.19) rotate(5deg) translateY(-2px)}}
@keyframes f10{0%,100%{transform:scale(1);filter:drop-shadow(0 0 11px rgba(159,18,57,.7)) drop-shadow(0 -4px 9px rgba(239,68,68,.45))}25%{transform:scale(1.23) rotate(-5deg) translateY(-4px);filter:drop-shadow(0 0 26px rgba(159,18,57,.95)) drop-shadow(0 -8px 16px rgba(239,68,68,.7))}75%{transform:scale(1.2) rotate(5deg) translateY(-3px)}}
@keyframes f11{0%,100%{transform:scale(1);filter:drop-shadow(0 0 12px rgba(194,65,12,.72)) drop-shadow(0 -5px 10px rgba(253,186,116,.5))}20%{transform:scale(1.25) rotate(-6deg) translateY(-4px);filter:drop-shadow(0 0 28px rgba(194,65,12,.98)) drop-shadow(0 -9px 18px rgba(253,186,116,.72))}80%{transform:scale(1.22) rotate(6deg) translateY(-3px)}}
@keyframes f12{0%,100%{transform:scale(1);filter:drop-shadow(0 0 13px rgba(234,88,12,.74)) drop-shadow(0 -5px 12px rgba(253,230,138,.5))}20%{transform:scale(1.26) rotate(-6deg) translateY(-5px);filter:drop-shadow(0 0 30px rgba(234,88,12,.99)) drop-shadow(0 -10px 20px rgba(253,230,138,.72))}80%{transform:scale(1.23) rotate(6deg) translateY(-4px)}}
@keyframes f13{0%,100%{transform:scale(1);filter:drop-shadow(0 0 14px rgba(255,119,0,.76)) drop-shadow(0 -6px 14px rgba(254,240,138,.55))}18%{transform:scale(1.28) rotate(-7deg) translateY(-5px);filter:drop-shadow(0 0 32px rgba(255,119,0,.99)) drop-shadow(0 -12px 22px rgba(254,240,138,.78))}82%{transform:scale(1.25) rotate(7deg) translateY(-4px)}}
@keyframes f14{0%,100%{transform:scale(1);filter:drop-shadow(0 0 16px rgba(255,119,0,.8)) drop-shadow(0 -6px 16px rgba(254,252,232,.6)) drop-shadow(0 0 32px rgba(239,68,68,.4))}15%{transform:scale(1.3) rotate(-8deg) translateY(-6px);filter:drop-shadow(0 0 36px rgba(255,119,0,1)) drop-shadow(0 -14px 26px rgba(254,252,232,.85)) drop-shadow(0 0 50px rgba(239,68,68,.62))}85%{transform:scale(1.27) rotate(8deg) translateY(-5px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes tabFadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.tab-fade-in{animation:tabFadeIn 0.2s ease-out both;}
@keyframes tabFadeOut{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-4px);}}
.tab-fade-out{animation:tabFadeOut 0.15s ease-in both;}
@keyframes crack{0%{transform:scale(1)}8%{transform:scale(.982) translateX(-2px) skewX(-1.5deg);box-shadow:0 0 0 1px var(--bloodbor),var(--card-shadow);}20%{transform:scale(.988) translateX(2px) skewX(1deg);}35%{transform:scale(.994) translateX(-1px);}50%{transform:scale(1.004);}100%{transform:scale(1);}}
@keyframes crackFlash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
@keyframes stampDone{0%{transform:scale(1)}30%{transform:scale(.85)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes stampFail{0%{transform:scale(1)}25%{transform:scale(.82)}65%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes flash{0%{opacity:1}30%{opacity:.12}100%{opacity:1}}
@keyframes scUpd{0%{opacity:1}20%{opacity:.45}100%{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes navPop{0%{transform:scale(1)}35%{transform:scale(.8)}75%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes rippleAnim{to{transform:scale(5);opacity:0}}
@keyframes ambientPulse{0%{opacity:.55;transform:scale(1) translate(0,0);}50%{opacity:1;transform:scale(1.06) translate(1%,-1%);}100%{opacity:.65;transform:scale(1.02) translate(-1%,1%);}}
.af{animation:fadeUp .2s ease both}
.s1{animation-delay:.04s}.s2{animation-delay:.08s}.s3{animation-delay:.12s}.s4{animation-delay:.16s}.s5{animation-delay:.2s}.s6{animation-delay:.24s}
#app{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;}
.hdr{padding:max(14px, calc(env(safe-area-inset-top) + 8px)) 18px 0;position:sticky;top:0;z-index:30;background:var(--chdr);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--cbor);transition:background .6s,border-color .6s;-webkit-user-select:none;user-select:none;}
.hdr-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-bottom:10px;}
.logo{font-family:'Cormorant Garamond',serif;font-size:26px;letter-spacing:7px;line-height:1;font-weight:700;text-transform:uppercase;text-shadow:var(--ts);}
.logo-d{font-size:12px;color:var(--ctdd);margin-right:5px;letter-spacing:0;vertical-align:middle;position:relative;top:-2px;}
.logo-g{color:var(--gold);}
.logo-c{color:var(--ctdd);}
.logo-sub{font-size:11px;letter-spacing:2.5px;color:var(--ctd);margin-top:3px;text-transform:uppercase;font-family:'Josefin Sans',sans-serif;font-weight:300;text-shadow:var(--ts);text-align:center;}
.hdr-logo-wrap{text-align:center;}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;justify-self:end;}
.hdr-date{font-size:11px;color:var(--ctd);letter-spacing:1px;font-family:'Josefin Sans',sans-serif;font-weight:400;text-shadow:var(--ts);}
.sbadge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;border:1px solid var(--cbor);background:var(--cs);box-shadow:var(--card-shadow);transition:border-color .4s,background .4s;min-width:60px;justify-content:center;}
.sbadge.bad{background:var(--bloodb);border-color:var(--bloodbor);}
.sfire{line-height:1;display:block;transform-origin:bottom center;}
.stxt{font-size:11px;letter-spacing:1.5px;font-family:'Josefin Sans',sans-serif;font-weight:600;text-transform:uppercase;white-space:nowrap;}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--cnb);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--cnbbor);display:flex;z-index:10001;height:68px;padding-bottom:env(safe-area-inset-bottom,0);transition:background .6s,border-color .6s;}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;cursor:pointer;padding:6px 4px;-webkit-user-select:none;user-select:none;}
.bni svg{width:20px;height:20px;stroke:var(--ctd);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s;}
.bni-lbl{font-size:9px;letter-spacing:2px;color:var(--ctd);font-family:'Josefin Sans',sans-serif;font-weight:400;text-transform:uppercase;text-shadow:var(--ts);}
.bni.on svg{stroke:var(--gold);}
.bni.on .bni-lbl{color:var(--gold);}
.bni.tap{animation:navPop .25s cubic-bezier(.34,1.56,.64,1);}
.bni-dot{display:none;}
.bni.on{background:none;border:none;border-radius:0;transition:none;}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 0 calc(68px + env(safe-area-inset-bottom, 10px));}
.card{background:var(--cs);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--cbor);border-radius:16px;box-shadow:var(--card-shadow);transition:background .6s,border-color .6s,box-shadow .6s;}
.qcard{margin:20px 18px 0;padding:20px 18px;border-left:2px solid var(--heat-color,rgba(201,168,76,0.5));cursor:pointer;transition:opacity .3s;overflow:hidden;word-wrap:break-word;}
.qcard:active{transform:scale(.99);}
.qtext{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;line-height:1.5;color:var(--cthi);margin-bottom:8px;overflow-wrap:break-word;}
.qauth{font-family:'Josefin Sans',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ctd);}
.scrow{display:flex;gap:10px;padding:16px 18px 0;}
.sc{flex:1;padding:16px 10px 14px;text-align:center;position:relative;overflow:hidden;}
.sc.lit{border-color:var(--goldbor);}
.sc.bad{border-color:var(--bloodbor);}
.sc::after{content:'';position:absolute;bottom:0;left:10%;width:80%;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:center;transition:transform .5s ease,background .4s;}
.sc.lit::after{transform:scaleX(1);}
.sc-num{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;font-style:italic;line-height:1;color:var(--ctd);text-shadow:var(--ts);}
.sc.lit .sc-num{color:var(--gold);}
.sc.bad .sc-num{color:var(--blood);}
.sc.ok .sc-num{color:var(--cts);}
.sc-word{font-family:'Josefin Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--ctdd);margin-top:1px;}
#streak-panel{display:none;border-radius:14px;overflow:hidden;border:1px solid var(--cbor);margin:8px 0 4px;position:relative;background:rgba(10,8,6,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--card-shadow);transition:border-color .5s;}
#streak-panel.open{display:block;animation:spIn .28s ease;}
@keyframes spIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.sp-inner{position:relative;z-index:1;padding:14px 14px 16px;}
.sp-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.sp-flame-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.sp-flame{line-height:1;display:block;animation:bigFlicker 2s ease-in-out infinite;transform-origin:bottom center;}
@keyframes bigFlicker{0%,100%{transform:scaleY(1) rotate(-1deg)}33%{transform:scaleY(1.06) rotate(1.5deg)}66%{transform:scaleY(.96) rotate(-1.5deg)}}
.sp-blood{position:absolute;inset:-12px;border-radius:50%;background:radial-gradient(circle,rgba(185,28,28,.55) 0%,rgba(185,28,28,.2) 40%,transparent 70%);animation:bloodPulse 2.2s ease-in-out infinite;pointer-events:none;}
@keyframes bloodPulse{0%,100%{opacity:var(--blood-op,0);transform:scale(1)}50%{opacity:calc(var(--blood-op,0)*1.3);transform:scale(1.08)}}
.sp-info{flex:1;}
.sp-num{font-family:'Cormorant Garamond',serif;font-weight:700;line-height:1;transition:color .6s,font-size .4s;}
.sp-tier{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;font-weight:600;margin-top:2px;transition:color .6s;}
.sp-sub{font-size:11px;letter-spacing:.8px;color:var(--ctd);margin-top:4px;font-style:italic;opacity:.75;}
.sp-next{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ctdd);margin-bottom:4px;}
.sp-pbar-wrap{height:2px;background:rgba(255,255,255,.06);border-radius:2px;margin-bottom:12px;}
.sp-pbar-fill{height:100%;border-radius:2px;transition:width .6s ease,background .6s ease;}
.sp-tiers{display:flex;flex-direction:column;gap:2px;}
.sp-trow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;transition:opacity .3s;}
.sp-trow.sp-current{background:rgba(255,255,255,.055);}
.sp-trow.sp-past{opacity:.4;}
.sp-trow.sp-locked{filter:blur(2px) grayscale(.75);opacity:.16;}
.sp-ticon{width:24px;text-align:center;line-height:1;flex-shrink:0;transition:font-size .4s,filter .4s;}
.sp-tname{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;flex:1;}
.sp-trange{font-size:11px;color:var(--ctd);letter-spacing:.5px;opacity:.6;}
.sp-check{font-size:11px;color:var(--ctdd);}
.sc-fire{display:block;line-height:1;margin-bottom:1px;transition:font-size .4s,filter .4s;}
@keyframes tierUp{0%{opacity:0;transform:scale(.7)}25%{opacity:.55}100%{opacity:0;transform:scale(1.8)}}
.tier-up-flash{position:absolute;inset:-4px;border-radius:12px;background:radial-gradient(circle,rgba(185,28,28,.45) 0%,rgba(185,28,28,.15) 50%,transparent 75%);animation:tierUp .9s ease-out forwards;pointer-events:none;z-index:10;}
.sc-lbl{font-size:11px;letter-spacing:2.5px;color:var(--ctdd);text-transform:uppercase;margin-top:6px;font-family:'Josefin Sans',sans-serif;font-weight:400;text-shadow:var(--ts);}
.sc-num.upd{animation:scUpd .35s ease;}
.shdr{padding:20px 18px 10px;}
.shdr-l{font-family:'Josefin Sans',sans-serif;font-weight:600;font-size:11px;letter-spacing:3.5px;color:var(--ct);text-transform:uppercase;text-shadow:var(--ts);}
.hlist{padding:0 18px;display:flex;flex-direction:column;gap:9px;}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.hcard{padding:16px 14px;display:flex;align-items:center;gap:10px;background:rgba(28,24,18,0.52);transition:border-color .2s,transform .15s,background .6s;overflow:hidden;}
.hcard:active{transform:scale(.99);}
.hcard.crack-anim{animation:crack .42s cubic-bezier(.36,.07,.19,.97) both;}
.hcard.crack-anim::after{content:'';position:absolute;inset:0;border-radius:16px;background:linear-gradient(128deg,transparent 38%,rgba(110,16,16,.18) 50%,transparent 62%);animation:crackFlash .42s ease both;pointer-events:none;}
.hcard.done{border-color:var(--goldbor);}
.hcard.failed{background:rgba(192,32,32,0.06);border-color:var(--bloodbor);}
.hcard-meta{flex:1;min-width:0;}
.hcard-name{font-size:12.5px;letter-spacing:1.5px;color:var(--ct);text-transform:uppercase;font-family:'Josefin Sans',sans-serif;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:var(--ts);}
.hcard.done .hcard-name{color:var(--gold);}
.hcard.failed .hcard-name{color:var(--ctdd);text-decoration:line-through;}
.hcard-cat{font-size:11px;letter-spacing:2px;color:#d8d2c8;margin-top:2px;text-transform:uppercase;font-family:'Josefin Sans',sans-serif;font-weight:300;text-shadow:var(--ts);}
.hcard-btns{display:flex;gap:5px;align-items:center;}
.hcard-streak{font-family:'Josefin Sans',sans-serif;font-size:11px;letter-spacing:1px;color:var(--ctdd);text-transform:uppercase;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:2px 7px;white-space:nowrap;text-shadow:var(--ts);}
.hbtn{width:42px;height:42px;border-radius:9px;border:1px solid var(--cbor);background:var(--cs2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;}
.hbtn:active{transform:scale(.82);}
.hbtn.don{background:var(--goldb);border-color:var(--goldbor);}
.hbtn.fai{background:var(--bloodb);border-color:var(--bloodbor);}
.hbtn.stamp-done{animation:stampDone .28s cubic-bezier(0.22,1,0.36,1);}
.hbtn.stamp-fail{animation:stampFail .28s cubic-bezier(0.22,1,0.36,1);}
.ripple{position:absolute;border-radius:50%;transform:scale(0);animation:rippleAnim .45s linear;background:rgba(140,110,32,.18);pointer-events:none;}
.empty-card{margin:20px 18px;padding:32px 20px 28px;text-align:center;cursor:pointer;border-style:dashed;border-color:rgba(212,160,23,0.2);}
.empty-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:var(--gold);text-shadow:var(--ts);margin-bottom:10px;line-height:1.3;}
.empty-sub{font-size:11px;color:var(--ctd);letter-spacing:1px;line-height:1.8;font-family:'Josefin Sans',sans-serif;font-weight:300;text-shadow:var(--ts);margin-bottom:16px;}
.empty-cta{font-family:'Josefin Sans',sans-serif;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);font-weight:600;text-shadow:var(--ts);}
.rec-card{margin:0 18px;overflow:hidden;}
.rgrid-head,.rgrid-row{display:grid;padding:9px 13px;}
.rgrid-head{border-bottom:1px solid var(--cbor);}
.rgrid-row{border-bottom:1px solid var(--cborl);}
.rgrid-row:last-child{border:none;}
.rday-lbl{font-size:11px;color:var(--ctd);text-align:center;font-family:'Josefin Sans',sans-serif;font-weight:400;letter-spacing:1.5px;text-transform:uppercase;text-shadow:var(--ts);}
.rday-lbl.td{color:var(--gold);}
.rhn{font-size:11px;color:var(--cts);letter-spacing:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase;font-family:'Josefin Sans',sans-serif;font-weight:600;text-shadow:var(--ts);}
.rcell{border-radius:5px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--cs2);}
.rcell.done{background:var(--goldb);color:var(--gold);}
.rcell.failed{background:var(--bloodb);color:var(--blood);}
.rcell.tcol{outline:1px solid var(--goldbor);}
.hmcard{margin:0 18px;padding:14px;}

<script>
/* STORAGE — localStorage */
const store={
  async get(key){const v=localStorage.getItem('gc:'+key);return v!==null?{value:v}:null;},
  async set(key,val){localStorage.setItem('gc:'+key,val);return{value:val};}
};

/* HEAT — discipline completion accent + marble warmth overlay */
function updateHeat(completed,total){
  const pct=total>0?completed/total:0;
  const r=Math.round(232+(212-232)*pct);
  const g=Math.round(232+(160-232)*pct);
  const b=Math.round(232+(23-232)*pct);
  const root=document.documentElement;
  root.style.setProperty('--heat',`rgb(${r},${g},${b})`);
  const overlayAlpha=(completed===total&&total>0)?'0.180':(pct*0.16).toFixed(3);
  root.style.setProperty('--heat-overlay-alpha',overlayAlpha);
  root.style.setProperty('--heat-color',`rgba(201,168,76,${(0.3+pct*0.7).toFixed(3)})`);
  const veil=document.getElementById('heat-veil');
  if(veil){
    document.documentElement.style.setProperty('--veil-base',overlayAlpha);
    veil.classList.toggle('pulsing',pct>=0.7&&total>0);
  }
  updateMotivation();
}
function updateMotivation(){ return; }

function checkAchievements() {
  const earned = loadAch();
  if(Object.keys(earned).length >= ACHIEVEMENTS.length) return;
  const hh = effH(), ll = effL();
  let totalDone = 0, perfectDayFound = false;
  const today = getDate(), todayLog = ll[today] || {};
  Object.entries(ll).forEach(([d, dayLog]) => {
    let dd = 0;
    hh.forEach(h => { if(dayLog[h.id]==='done'){ totalDone++; dd++; } });
    if(hh.length && dd === hh.length) perfectDayFound = true;
  });
  const streak = calcStreak();
  const realHabits = isPlaceholder ? [] : habits;

  const conditions = {
    first_log:   totalDone >= 1,
    first_forge: realHabits.length >= 1,
    streak_3:    streak >= 3,
    streak_7:    streak >= 7,
    streak_30:   streak >= 30,
    streak_100:  streak >= 100,
    perfect_day: perfectDayFound,
    centurion:   totalDone >= 100,
    five_habits: realHabits.length >= 5,
    no_miss:     hh.length > 0 && !Object.values(todayLog).includes('failed') && hh.some(h=>todayLog[h.id]==='done'),
  };

  let queue = [];
  ACHIEVEMENTS.forEach(a => {
    if(!earned[a.id] && conditions[a.id]) {
      earned[a.id] = Date.now();
      queue.push(a);
    }
  });
  if(queue.length) {
    saveAch(earned);
    let i = 0;
    function showNext() {
      if(i >= queue.length) return;
      showAchBanner(queue[i++]);
      setTimeout(showNext, 4200);
    }
    showNext();
  }
}

function flameData(days){
  const t=Math.min(days,365)/365;
  const e=1-(1-t)*(1-t);
  function lerp(a,b){return a+(b-a)*Math.min(1,Math.max(0,e));}
  const tierIdx=TIERS.findIndex((_,i,a)=>i===a.length-1||days<a[i+1].min);
  return{
    compactSize:Math.round(lerp(11,22)),
    bigSize:Math.round(lerp(32,52)),
    hue:Math.round(lerp(0,-32)),
    sat:+lerp(.6,1.75).toFixed(2),
    bloodOp:+lerp(0,.95).toFixed(2),
    lavaH:Math.round(lerp(4,82)),
    drips:Math.min(5,Math.round(lerp(1,5))),
    dripSpeed:+lerp(4.5,1.8).toFixed(1),
    flickerSpd:+lerp(2.8,1.1).toFixed(1),
    tierIdx,
    iconSize(i){return Math.round(10+i*(18/(TIERS.length-1)));}
  };
}
function renderStreakCard(days){
  const fd=flameData(days);
  const tier=getTier(days);
  const tierIdx=TIERS.indexOf(tier);
  const nextTier=TIERS[tierIdx+1]||null;
  const pct=nextTier?Math.min(100,Math.round(((days-tier.min)/(Math.max(1,nextTier.min-tier.min)))*100)):100;
  const allTierRows=TIERS.filter(t=>t.min>0);
  const pastRows=allTierRows.filter(t=>days>t.max&&TIERS.indexOf(t)<tierIdx);
  const lockedRows=allTierRows.filter(t=>t.min>days&&t!==tier);
  const visibleTiers=[
    ...pastRows.slice(-1),
    tier,
    ...lockedRows.slice(0,3)
  ];
  let lockedCount=0;
  const lockedOpacity=[.72,.38,.14];
  const lockedBlur=[0.5,1.8,3.5];
  const rows=visibleTiers.map(t=>{
    const realIdx=TIERS.indexOf(t);
    const isPast=days>t.max&&realIdx<tierIdx;
    const isCurrent=t===tier;
    const isLocked=t.min>days;
    const li=isLocked?lockedCount++:0;
    const opacity=isLocked?lockedOpacity[Math.min(li,2)]:1;
    const blur=isLocked?lockedBlur[Math.min(li,2)]:0;
    const cls=isPast?'sp-trow sp-past':isCurrent?'sp-trow sp-current':'sp-trow';
    const lockedStyle=isLocked?`style="opacity:${opacity};filter:blur(${blur}px) grayscale(.6);"` : '';
    const iconPx=fd.iconSize(realIdx);
    const iconFilter=`saturate(${(0.5+realIdx*0.09).toFixed(2)}) hue-rotate(${Math.round(-realIdx*2.2)}deg)`;
    const nameColor=isCurrent?tier.color:isPast?'var(--ctdd)':'inherit';
    const rangeStr=t.max>=9999?`Day ${t.min}+`:(t.min===t.max?`Day ${t.min}`:`Day ${t.min}–${t.max}`);
    return `<div class="${cls}" ${lockedStyle}><span class="sp-ticon" style="font-size:${iconPx}px;filter:${iconFilter};">🔥</span><div class="sp-tname" style="color:${nameColor};">${t.name}${isCurrent?' ← you':''}</div><div class="sp-trange">${rangeStr}</div>${isPast?'<span class="sp-check">✓</span>':''}</div>`;
  }).join('');
  const nextStr=nextTier?`Next: ${nextTier.name} — ${nextTier.min-days} day${nextTier.min-days===1?'':'s'} away`:'Legend. You are the standard.';
  return `<div class="sp-inner"><div class="sp-top"><div class="sp-flame-wrap"><div class="sp-blood" style="--blood-op:${fd.bloodOp};"></div><span class="sp-flame" style="font-size:${fd.bigSize}px;filter:saturate(${fd.sat}) hue-rotate(${fd.hue}deg);animation-duration:${fd.flickerSpd}s;">🔥</span></div><div class="sp-info"><div class="sp-num" style="font-size:${Math.round(36+fd.bloodOp*14)}px;color:${tier.color};">${days}</div><div class="sp-tier" style="color:${tier.color};">${tier.name}</div><div class="sp-sub">"${tier.sub}"</div></div></div><div class="sp-next">${nextStr}</div><div class="sp-pbar-wrap"><div class="sp-pbar-fill" style="width:${pct}%;background:linear-gradient(90deg,${tier.color},${nextTier?nextTier.color:tier.color});"></div></div><div class="sp-tiers">${rows}</div></div>`;
}

function getMonthList(){
  const ll=effL(),hh=effH();
  const today=getDate();
  const logKeys=Object.keys(ll).sort();
  const earliest=logKeys[0]||today;
  let[ey,em]=earliest.slice(0,7).split('-').map(Number);
  const[ty,tm]=today.slice(0,7).split('-').map(Number);
  const months=[];
  while(ey<ty||(ey===ty&&em<=tm)){
    const daysInMonth=new Date(ey,em,0).getDate();
    const startDow=new Date(ey,em-1,1).getDay();
    const prefix=`${ey}-${String(em).padStart(2,'0')}`;
    const dayPcts=[];
    for(let d=1;d<=daysInMonth;d++){
      const ds=`${prefix}-${String(d).padStart(2,'0')}`;
      const p=dayPct(ds,hh,ll);
      if(p!==null)dayPcts.push(p);
    }
    const hasData=dayPcts.length>0;
    const avg=hasData?Math.round(dayPcts.reduce((a,b)=>a+b,0)/dayPcts.length):0;
    months.push({year:ey,month:em,prefix,daysInMonth,startDow,pct:avg,hasData,word:scoreWord(avg)});
    em++;if(em>12){em=1;ey++;}
  }
  return months;
}

function drawRing(mode){
  const m=monthList[currentMonthIdx];
  if(!m)return;
  const hh=effH(),ll=effL();
  const today=getDate();
  const todayPrefix=today.slice(0,7);
  const isCurrentMonth=(m.prefix===todayPrefix);
  const todayDay=isCurrentMonth?parseInt(today.slice(8)):0;

  const CX=128,CY=128,R=122,RI=82;
  const GAP=1.5*Math.PI/180;
  const daysInMonth=m.daysInMonth;
  const sliceAngle=(2*Math.PI)/daysInMonth;

  function wedgePath(i){
    const a1=i*sliceAngle+GAP/2;
    const a2=(i+1)*sliceAngle-GAP/2;
    const ox1=CX+R*Math.cos(a1),oy1=CY+R*Math.sin(a1);
    const ox2=CX+R*Math.cos(a2),oy2=CY+R*Math.sin(a2);
    const ix1=CX+RI*Math.cos(a2),iy1=CY+RI*Math.sin(a2);
    const ix2=CX+RI*Math.cos(a1),iy2=CY+RI*Math.sin(a1);
    const large=(a2-a1>Math.PI)?1:0;
    return`M${ox1},${oy1} A${R},${R} 0 ${large} 1 ${ox2},${oy2} L${ix1},${iy1} A${RI},${RI} 0 ${large} 0 ${ix2},${iy2} Z`;
  }

  function wedgeFill(pct){
    if(pct===100)return'rgba(201,168,76,0.50)';
    if(pct>=80)return'rgba(201,168,76,0.40)';
    if(pct>=60)return'rgba(201,168,76,0.30)';
    if(pct>=40)return'rgba(201,168,76,0.20)';
    if(pct>=20)return'rgba(201,168,76,0.12)';
    return'rgba(201,168,76,0.05)';
  }

  const svg=document.getElementById('fr-ring-svg');
  if(!svg)return;
  // Preserve <defs>, remove everything else
  const defs=svg.querySelector('defs');
  while(svg.lastChild){svg.removeChild(svg.lastChild);}
  if(defs)svg.appendChild(defs);

  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.id='fr-wedges';

  let daysWithData=0;

  for(let d=1;d<=daysInMonth;d++){
    const i=d-1;
    const dateStr=`${m.prefix}-${String(d).padStart(2,'0')}`;
    const isToday=(isCurrentMonth&&d===todayDay);
    const isFuture=(isCurrentMonth&&d>todayDay)||(m.year>parseInt(today.slice(0,4)))||(m.year===parseInt(today.slice(0,4))&&m.month>parseInt(today.slice(5,7)));
    const pct=dayPct(dateStr,hh,ll);
    if(pct!==null)daysWithData++;

    // Build wedge path
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',wedgePath(i));
    path.setAttribute('data-day',String(d));

    if(isFuture){
      path.setAttribute('fill','rgba(201,168,76,0.02)');
      path.setAttribute('stroke','none');
      path.setAttribute('aria-hidden','true');
      path.style.transition='opacity 0.3s ease';
      g.appendChild(path);
      continue;
    }

    const fillPct=(pct!==null)?pct:0;
    const fill=(pct===null)?'rgba(201,168,76,0.05)':wedgeFill(fillPct);
    path.setAttribute('fill',fill);

    if(isToday){
      path.setAttribute('stroke','rgba(201,168,76,0.4)');
      path.setAttribute('stroke-dasharray','4 2');
      path.setAttribute('stroke-width','1.5');
    } else {
      path.setAttribute('stroke','none');
    }

    const label=isToday?'Today, in progress':`Day ${d}: ${fillPct}% — ${scoreWord(fillPct)}`;
    path.setAttribute('role','button');
    path.setAttribute('tabindex','0');
    path.setAttribute('aria-label',label);
    path.style.cursor='pointer';
    path.style.transition='opacity 0.3s ease';
    path.addEventListener('click',()=>tapWedge(d,dateStr,pct!==null?pct:0,isToday));
    path.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')tapWedge(d,dateStr,pct!==null?pct:0,isToday);});
    g.appendChild(path);

    // Day number text (skip future days)
    const midAngle=i*sliceAngle+sliceAngle/2;
    const textR=(RI+R)/2;
    const tx=CX+textR*Math.cos(midAngle);
    const ty=CY+textR*Math.sin(midAngle);
    const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x',tx.toFixed(1));
    txt.setAttribute('y',ty.toFixed(1));
    txt.setAttribute('class','fr-day-num');
    txt.setAttribute('text-anchor','middle');
    txt.setAttribute('dominant-baseline','central');
    txt.setAttribute('pointer-events','none');
    txt.setAttribute('data-day',String(d));
    txt.textContent=String(d);
    g.appendChild(txt);
  }

  // Center circle
  const centerCircle=document.createElementNS('http://www.w3.org/2000/svg','circle');
  centerCircle.setAttribute('cx','128');centerCircle.setAttribute('cy','128');centerCircle.setAttribute('r','80');
  centerCircle.setAttribute('fill','rgba(10,8,6,0.92)');centerCircle.setAttribute('pointer-events','none');

  svg.appendChild(g);
  svg.appendChild(centerCircle);

  // Update center content
  const pctEl=document.getElementById('fr-rc-pct');
  const wordEl=document.getElementById('fr-rc-word');
  const daysEl=document.getElementById('fr-rc-days');
  if(pctEl&&wordEl&&daysEl){
    if(!m.hasData&&effH().length===0){
      pctEl.textContent='—';
      wordEl.textContent='Start forging';
      daysEl.innerHTML='<a class="fr-rc-cta" style="cursor:pointer;color:var(--gold);text-decoration:none;font-size:9px;" onclick="sw(\'forge\',document.querySelector(\'.bni[data-v=forge]\'))">Set up your first discipline →</a>';
    } else {
      pctEl.textContent=(m.hasData&&m.pct!=null)?m.pct+'%':'—';
      wordEl.textContent=(m.hasData&&m.word)?m.word:'No data';
      daysEl.textContent=(m.hasData&&daysWithData!=null)?daysWithData+' of '+daysInMonth+' days':'';
    }
  }

  // Update arrow dim states
  const prevBtn=document.getElementById('fr-prev');
  const nextBtn=document.getElementById('fr-next');
  if(prevBtn)prevBtn.classList.toggle('dim',currentMonthIdx<=0);
  if(nextBtn)nextBtn.classList.toggle('dim',currentMonthIdx>=monthList.length-1);

  // Animation modes
  if(mode==='assemble'){
    const paths=g.querySelectorAll('path');
    paths.forEach((p,i)=>{
      p.style.opacity='0';
    });
    requestAnimationFrame(()=>{
      paths.forEach((p,i)=>{
        p.style.transitionDelay=`${i*20}ms`;
        p.style.opacity='1';
      });
    });
  } else if(mode==='transition'){
    svg.style.transition='opacity 150ms ease-in';
    svg.style.opacity='0';
    setTimeout(()=>{
      svg.style.transition='opacity 220ms cubic-bezier(0.22,1,0.36,1)';
      svg.style.opacity='1';
    },160);
  }
  // mode === false: instant, no animation needed
}

function initWheelSwipe() {
  const wrap = document.getElementById('fr-wheel-wrap');
  const svg = document.getElementById('fr-ring-svg');
  if (!wrap || !svg) return;

  let activePointerId = null;
  let startAngle = 0;
  let currentRotation = 0;
  let selectedDay = null;

  // Compute initial rotation: today (or last data day) at 12 o'clock
  const m = monthList[currentMonthIdx];
  const sliceAngle = 360 / m.daysInMonth;
  const today = getDate();
  const isCurrentMonth = (m.prefix === today.slice(0, 7));
  const targetDay = isCurrentMonth ? parseInt(today.slice(8)) : m.daysInMonth;
  currentRotation = -90 - (targetDay - 1) * sliceAngle - sliceAngle / 2;
  svg.style.transform = `rotate(${currentRotation}deg)`;

  function getAngle(e) {
    const rect = wrap.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    return Math.atan2(e.clientY - cy, e.clientX - cx) * (180 / Math.PI);
  }

  function snapToNearest() {
    const daysInMonth = monthList[currentMonthIdx].daysInMonth;
    const sliceDeg = 360 / daysInMonth;
    const offset = ((-90 - currentRotation) % 360 + 360) % 360;
    const dayIdx = Math.round(offset / sliceDeg) % daysInMonth;
    let targetRotation = -90 - dayIdx * sliceDeg - sliceDeg / 2;
    while (targetRotation - currentRotation > 180) targetRotation -= 360;
    while (targetRotation - currentRotation < -180) targetRotation += 360;
    svg.style.transition = 'transform 280ms cubic-bezier(0.25,1,0.5,1)';
    svg.style.transform = `rotate(${targetRotation}deg)`;
    currentRotation = targetRotation;
    selectDay(dayIdx + 1);
    setTimeout(() => { svg.style.transition = ''; }, 300);
  }

  function selectDay(day) {
    if (selectedDay === day) {
      // Second tap on same day -> open full detail
      const mo = monthList[currentMonthIdx];
      const ds = `${mo.prefix}-${String(day).padStart(2,'0')}`;
      const pct = dayPct(ds, effH(), effL());
      const isToday = (ds === getDate());
      tapWedge(day, ds, pct, isToday);
      return;
    }
    selectedDay = day;
    const paths = svg.querySelectorAll('path[data-day]');
    const daysInMonth = monthList[currentMonthIdx].daysInMonth;
    const sliceDeg = 360 / daysInMonth;
    paths.forEach(p => {
      const d = parseInt(p.dataset.day);
      if (d === day) {
        const midAngle = ((d - 1) * sliceDeg + sliceDeg / 2) * Math.PI / 180;
        const dx = Math.cos(midAngle) * 8;
        const dy = Math.sin(midAngle) * 8;
        p.setAttribute('transform', `translate(${dx},${dy})`);
        p.style.filter = 'url(#wedge-glow)';
        p.classList.add('fr-wedge--selected');
        p.classList.remove('fr-wedge--dimmed');
      } else {
        p.removeAttribute('transform');
        p.style.filter = '';
        p.classList.remove('fr-wedge--selected');
        p.classList.add('fr-wedge--dimmed');
      }
    });
    // Also move the corresponding day number text
    const texts = svg.querySelectorAll('text[data-day]');
    texts.forEach(t => {
      const d = parseInt(t.dataset.day);
      if (d === day) {
        const midAngle = ((d - 1) * sliceDeg + sliceDeg / 2) * Math.PI / 180;
        const dx = Math.cos(midAngle) * 8;
        const dy = Math.sin(midAngle) * 8;
        t.setAttribute('transform', `translate(${dx},${dy})`);
      } else {
        t.removeAttribute('transform');
      }
    });
    wrap.classList.add('scaled');
    const hint = document.getElementById('fr-swipe-hint');
    if (hint) hint.style.opacity = '0';
    const mo = monthList[currentMonthIdx];
    const ds = `${mo.prefix}-${String(day).padStart(2,'0')}`;
    const pct = dayPct(ds, effH(), effL());
    const isToday = (ds === getDate());
    showDayInfo(day, ds, pct, isToday);
  }

  function deselectDay() {
    selectedDay = null;
    const paths = svg.querySelectorAll('path[data-day]');
    paths.forEach(p => {
      p.removeAttribute('transform');
      p.style.filter = '';
      p.classList.remove('fr-wedge--dimmed');
      p.classList.remove('fr-wedge--selected');
    });
    const texts = svg.querySelectorAll('text[data-day]');
    texts.forEach(t => t.removeAttribute('transform'));
    wrap.classList.remove('scaled');
    const hint = document.getElementById('fr-swipe-hint');
    if (hint) hint.style.opacity = '';
    showMonthSummary();
  }

  // Pointer events
  wrap.addEventListener('pointerdown', (e) => {
    if (activePointerId !== null) return;
    activePointerId = e.pointerId;
    wrap.setPointerCapture(e.pointerId);
    startAngle = getAngle(e) - currentRotation;
    svg.style.transition = '';
  });

  wrap.addEventListener('pointermove', (e) => {
    if (e.pointerId !== activePointerId) return;
    currentRotation = getAngle(e) - startAngle;
    svg.style.transform = `rotate(${currentRotation}deg)`;
  });

  wrap.addEventListener('pointerup', (e) => {
    if (e.pointerId !== activePointerId) return;
    wrap.releasePointerCapture(e.pointerId);
    activePointerId = null;
    snapToNearest();
  });

  wrap.addEventListener('pointercancel', (e) => {
    if (e.pointerId !== activePointerId) return;
    activePointerId = null;
    snapToNearest();
  });

  // Expose for external access (month changes, closeDetail)
  wrap._resetRotation = function() {
    selectedDay = null;
    deselectDay();
    const nm = monthList[currentMonthIdx];
    const sd = 360 / nm.daysInMonth;
    const td = nm.prefix === getDate().slice(0,7) ? parseInt(getDate().slice(8)) : nm.daysInMonth;
    currentRotation = -90 - (td - 1) * sd - sd / 2;
    svg.style.transition = 'transform 280ms cubic-bezier(0.25,1,0.5,1)';
    svg.style.transform = `rotate(${currentRotation}deg)`;
    setTimeout(() => { svg.style.transition = ''; }, 300);
  };
  wrap._deselectDay = deselectDay;
}

function showDayInfo(day, dateStr, pct, isToday) {
  const center = document.getElementById('fr-ring-center');
  if (!center) return;
  const d = new Date(dateStr + 'T00:00:00');
  const mn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dateText = `${mn[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  const word = isToday ? 'In progress\u2026' : scoreWord(pct || 0);
  const hh = effH(), ll = effL();
  const dayLog = ll[dateStr] || {};
  const doneCount = hh.filter(h => dayLog[h.id] === 'done').length;

  center.style.transition = 'opacity 130ms ease-in';
  center.style.opacity = '0';
  setTimeout(() => {
    document.getElementById('fr-rc-pct').textContent = `${pct || 0}%`;
    document.getElementById('fr-rc-word').textContent = word;
    document.getElementById('fr-rc-days').textContent = `${doneCount} of ${hh.length} done`;
    let dateEl = document.getElementById('fr-rc-date');
    if (!dateEl) {
      dateEl = document.createElement('div');
      dateEl.id = 'fr-rc-date';
      dateEl.style.cssText = 'font-family:"Josefin Sans",sans-serif;font-size:8px;letter-spacing:0.12em;opacity:0.35;text-transform:uppercase;margin-bottom:2px;';
      center.insertBefore(dateEl, center.firstChild);
    }
    dateEl.textContent = dateText;
    dateEl.style.display = '';
    center.style.transition = 'opacity 220ms cubic-bezier(0.25,1,0.5,1)';
    requestAnimationFrame(() => center.style.opacity = '1');
  }, 140);
}

function showMonthSummary() {
  const center = document.getElementById('fr-ring-center');
  if (!center) return;
  const m = monthList[currentMonthIdx];
  center.style.transition = 'opacity 130ms ease-in';
  center.style.opacity = '0';
  setTimeout(() => {
    const dateEl = document.getElementById('fr-rc-date');
    if (dateEl) dateEl.style.display = 'none';
    document.getElementById('fr-rc-pct').textContent = (m.hasData && m.pct != null) ? `${m.pct}%` : '\u2014';
    document.getElementById('fr-rc-word').textContent = (m.hasData && m.word) ? m.word : 'No data';
    document.getElementById('fr-rc-days').textContent = (m.hasData && m.daysWithData != null) ? `${m.daysWithData} of ${m.daysInMonth} days` : '';
    center.style.transition = 'opacity 220ms cubic-bezier(0.25,1,0.5,1)';
    requestAnimationFrame(() => center.style.opacity = '1');
  }, 140);
}

function tapWedge(day,dateStr,pct,isToday){
  const center=document.getElementById('fr-ring-center');
  const detail=document.getElementById('fr-day-detail');
  if(!center||!detail)return;

  // Fill detail content
  const hh=effH(),ll=effL();
  const dayLog=ll[dateStr]||{};

  const d=new Date(dateStr+'T00:00:00');
  const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('fr-dd-date').textContent=`${monthNames[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;

  if(isToday){
    document.getElementById('fr-dd-pct').textContent=`${pct||0}% — In progress…`;
  } else {
    document.getElementById('fr-dd-pct').textContent=`${pct||0}% — ${scoreWord(pct||0)}`;
  }

  const habitsEl=document.getElementById('fr-dd-habits');
  habitsEl.innerHTML='';
  hh.forEach(h=>{
    const status=dayLog[h.id];
    const icon=status==='done'?'✓':status==='failed'?'✗':'·';
    const cls=status==='done'?'fr-dd-done':status==='failed'?'fr-dd-fail':'fr-dd-skip';
    const row=document.createElement('div');
    row.className='fr-dd-row';
    row.innerHTML=`<span class="fr-dd-icon ${cls}">${icon}</span><span class="fr-dd-name">${h.name}</span>`;
    habitsEl.appendChild(row);
  });

  // Crossfade center → detail
  center.style.transition='opacity 130ms ease-in';
  center.style.opacity='0';
  setTimeout(()=>{
    center.style.display='none';
    detail.style.display='flex';
    detail.style.transition='opacity 220ms cubic-bezier(0.22,1,0.36,1)';
    requestAnimationFrame(()=>detail.style.opacity='1');
  },140);
}

function closeDetail(){
  const center=document.getElementById('fr-ring-center');
  const detail=document.getElementById('fr-day-detail');
  if(!center||!detail)return;
  detail.style.transition='opacity 130ms ease-in';
  detail.style.opacity='0';
  setTimeout(()=>{
    detail.style.display='none';
    center.style.display='';
    center.style.transition='opacity 180ms cubic-bezier(0.22,1,0.36,1)';
    requestAnimationFrame(()=>center.style.opacity='1');
  },140);
}

function updateRingHeader(direction){
  const m=monthList[currentMonthIdx];
  if(!m)return;
  const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const name=monthNames[m.month-1];
  const year=m.year;

  // Month title
  const titleEl=document.getElementById('fr-month-title');
  if(titleEl)titleEl.textContent=`${name.slice(0,3).toUpperCase()} ${year}`;

  // Ghost name animation
  const ghost=document.getElementById('fr-ghost-name');
  if(ghost){
    const dx=direction==='next'?30:(direction==='prev'?-30:0);
    if(dx!==0){
      // Slide out
      ghost.style.transition='opacity 180ms ease-in, transform 180ms ease-in';
      ghost.style.opacity='0';
      ghost.style.transform=`translateX(${dx}px)`;
      setTimeout(()=>{
        ghost.textContent=name;
        ghost.style.transition='none';
        ghost.style.transform=`translateX(${-dx}px)`;
        ghost.style.opacity='0';
        requestAnimationFrame(()=>{
          ghost.style.transition='opacity 220ms cubic-bezier(0.22,1,0.36,1), transform 220ms cubic-bezier(0.22,1,0.36,1)';
          ghost.style.opacity='1';
          ghost.style.transform='translateX(0)';
        });
      },190);
    } else {
      ghost.textContent=name;
      ghost.style.opacity='1';
      ghost.style.transform='translateX(0)';
    }
  }

  // Disable/enable arrows
  const prev=document.getElementById('fr-prev');
  const next=document.getElementById('fr-next');
  if(prev)prev.classList.toggle('dim',currentMonthIdx===0);
  if(next)next.classList.toggle('dim',currentMonthIdx===monthList.length-1);
}

function changeMonth(delta){
  const next=currentMonthIdx+delta;
  if(next<0||next>=monthList.length)return;
  currentMonthIdx=next;
  const dir=delta>0?'next':'prev';
  updateRingHeader(dir);
  drawRing('transition');
  // Terrain: just shift active class, no re-animation
  const cols=document.querySelectorAll('.fr-t-col');
  cols.forEach((col,i)=>{
    const bar=col.querySelector('.fr-t-bar');
    if(!bar)return;
    bar.classList.remove('fr-t-bar--active');
    if(i===currentMonthIdx)bar.classList.add('fr-t-bar--active');
  });
}

function buildTerrain(){
  const inner=document.getElementById('fr-terrain-inner');
  if(!inner)return;
  inner.innerHTML='';
  let lastYear=null;

  monthList.forEach((m,i)=>{
    // Year boundary marker
    if(lastYear!==null&&m.year!==lastYear){
      const ym=document.createElement('div');
      ym.className='fr-t-year-mark';
      ym.innerHTML=`<span class="fr-t-year-lbl">${m.year}</span>`;
      inner.appendChild(ym);
    }
    lastYear=m.year;

    const isActive=(i===currentMonthIdx);
    const barH=Math.max(14,Math.round((m.pct/100)*(isActive?160:130)));
    const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    // Determine bar state class
    let stateClass='fr-t-bar--empty';
    if(isActive){
      stateClass='fr-t-bar--active';
    } else if(m.hasData){
      if(m.pct>=80)stateClass='fr-t-bar--best';
      else if(m.pct>=60)stateClass='fr-t-bar--high';
      else if(m.pct>=40)stateClass='fr-t-bar--mid';
      else stateClass='fr-t-bar--low';
    }

    const col=document.createElement('div');
    col.className='fr-t-col';
    col.dataset.idx=i;
    col.setAttribute('role','button');
    col.setAttribute('tabindex','0');
    col.setAttribute('aria-label',`${monthNames[m.month-1]} ${m.year}: ${m.hasData?m.pct+'%':'no data'}`);
    col.addEventListener('click',()=>jumpToMonth(i));
    col.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')jumpToMonth(i);});

    const bar=document.createElement('div');
    bar.className=`fr-t-bar ${stateClass}`;
    bar.style.height=`${barH}px`;
    bar.style.animationDelay=`${i*55}ms`;

    const lbl=document.createElement('div');
    lbl.className=`fr-t-lbl${isActive?' fr-t-lbl--active':''}`;
    lbl.textContent=monthNames[m.month-1].slice(0,3);

    col.appendChild(bar);
    col.appendChild(lbl);
    inner.appendChild(col);
  });

  // Auto-scroll to active column (current month visible)
  requestAnimationFrame(()=>{
    const activeCol=inner.querySelector(`[data-idx="${currentMonthIdx}"]`);
    const stage=document.getElementById('fr-terrain-stage');
    if(activeCol&&stage){
      const colLeft=activeCol.offsetLeft;
      const colW=activeCol.offsetWidth;
      const stageW=stage.offsetWidth;
      // Center active column in view
      const targetOffset=-(colLeft-(stageW/2-colW/2));
      const maxOffset=0;
      const innerW=inner.scrollWidth;
      const minOffset=Math.min(0,stageW-innerW);
      inner.style.transform=`translateX(${Math.max(minOffset,Math.min(maxOffset,targetOffset))}px)`;
      inner._terrainOffset=Math.max(minOffset,Math.min(maxOffset,targetOffset));
    }
  });
}

function initTerrainDrag(){
  const stage=document.getElementById('fr-terrain-stage');
  const inner=document.getElementById('fr-terrain-inner');
  if(!stage||!inner)return;

  let dragging=false,startX=0,velocity=0,offset=inner._terrainOffset||0,rafId=null;

  function clampOffset(v){
    const innerW=inner.scrollWidth;
    const stageW=stage.offsetWidth;
    const min=Math.min(0,stageW-innerW);
    return Math.max(min,Math.min(0,v));
  }

  function applyOffset(){
    inner.style.transform=`translateX(${offset}px)`;
    inner._terrainOffset=offset;
  }

  function momentum(){
    velocity*=0.88;
    offset=clampOffset(offset+velocity);
    applyOffset();
    if(Math.abs(velocity)>0.5){
      rafId=requestAnimationFrame(momentum);
    } else {
      rafId=null;
    }
  }

  function startDrag(x){
    dragging=true;
    startX=x;
    velocity=0;
    if(rafId){cancelAnimationFrame(rafId);rafId=null;}
    stage.style.cursor='grabbing';
  }

  function moveDrag(x){
    if(!dragging)return;
    const dx=x-startX;
    startX=x;
    velocity=dx;
    offset=clampOffset(offset+dx);
    applyOffset();
  }

  function endDrag(){
    if(!dragging)return;
    dragging=false;
    stage.style.cursor='grab';
    if(Math.abs(velocity)>0.5){
      startAnimFrame();
    }
  }

  stage.addEventListener('mousedown',e=>{startDrag(e.clientX);e.preventDefault();});
  window.addEventListener('mousemove',e=>{if(dragging)moveDrag(e.clientX);});
  window.addEventListener('mouseup',endDrag);
  stage.addEventListener('touchstart',e=>{e.preventDefault();startDrag(e.touches[0].clientX);},{passive:false});
  stage.addEventListener('touchmove',e=>{e.preventDefault();moveDrag(e.touches[0].clientX);},{passive:false});
  stage.addEventListener('touchend',endDrag);
  stage.style.cursor='grab';

  // Expose state for Task 10 shared rAF loop
  window._frTerrain={
    get velocity(){return velocity;},
    get dragging(){return dragging;},
    set velocity(v){velocity=v;},
    momentum:()=>{rafId=requestAnimationFrame(momentum);}
  };
}

let _frRafId=null;

function animFrame(){
  let active=false;
  const terrain=window._frTerrain;

  // Terrain momentum
  if(terrain&&!terrain.dragging&&Math.abs(terrain.velocity)>0.5){
    terrain.velocity*=0.88;
    const inner=document.getElementById('fr-terrain-inner');
    const stage=document.getElementById('fr-terrain-stage');
    if(inner&&stage){
      const innerW=inner.scrollWidth,stageW=stage.offsetWidth;
      const min=Math.min(0,stageW-innerW);
      let off=(inner._terrainOffset||0)+terrain.velocity;
      off=Math.max(min,Math.min(0,off));
      inner.style.transform=`translateX(${off}px)`;
      inner._terrainOffset=off;
    }
    active=true;
  }

  if(active){
    _frRafId=requestAnimationFrame(animFrame);
  } else {
    _frRafId=null;
  }
}

function startAnimFrame(){
  if(!_frRafId)_frRafId=requestAnimationFrame(animFrame);
}

function jumpToMonth(idx){
  if(idx<0||idx>=monthList.length)return;
  currentMonthIdx=idx;
  updateRingHeader();
  drawRing(false);
  // Rebuild terrain to shift active class (no bar re-animation needed — we just update classes)
  const cols=document.querySelectorAll('.fr-t-col');
  cols.forEach((col,i)=>{
    const bar=col.querySelector('.fr-t-bar');
    if(!bar)return;
    bar.classList.remove('fr-t-bar--active','fr-t-bar--best','fr-t-bar--high','fr-t-bar--mid','fr-t-bar--low','fr-t-bar--empty');
    const m=monthList[i];
    if(i===currentMonthIdx){
      bar.classList.add('fr-t-bar--active');
    } else if(m.hasData){
      if(m.pct>=80)bar.classList.add('fr-t-bar--best');
      else if(m.pct>=60)bar.classList.add('fr-t-bar--high');
      else if(m.pct>=40)bar.classList.add('fr-t-bar--mid');
      else bar.classList.add('fr-t-bar--low');
    } else {
      bar.classList.add('fr-t-bar--empty');
    }
    const lbl=col.querySelector('.fr-t-lbl');
    if(lbl)lbl.classList.toggle('fr-t-lbl--active',i===currentMonthIdx);
  });
  // Smooth scroll terrain to bring jumped column into view
  requestAnimationFrame(()=>{
    const inner=document.getElementById('fr-terrain-inner');
    const stage=document.getElementById('fr-terrain-stage');
    const activeCol=document.querySelector(`.fr-t-col[data-idx="${idx}"]`);
    if(!inner||!stage||!activeCol)return;
    const stageW=stage.offsetWidth;
    const colLeft=activeCol.offsetLeft;
    const colW=activeCol.offsetWidth;
    const target=-(colLeft-(stageW/2-colW/2));
    const innerW=inner.scrollWidth;
    const min=Math.min(0,stageW-innerW);
    const clamped=Math.max(min,Math.min(0,target));
    // Animate offset to target
    let current=inner._terrainOffset||0;
    const diff=clamped-current;
    if(Math.abs(diff)<2){return;}
    function scrollStep(){
      current+=(clamped-current)*0.18;
      inner.style.transform=`translateX(${current}px)`;
      inner._terrainOffset=current;
      if(Math.abs(clamped-current)>1)requestAnimationFrame(scrollStep);
      else{inner.style.transform=`translateX(${clamped}px)`;inner._terrainOffset=clamped;}
    }
    requestAnimationFrame(scrollStep);
  });
}

function getDate(){const sim=localStorage.getItem('gc:sim_date');return sim||new Date().toISOString().split('T')[0];}
function getHour(){return new Date().getHours();}
function daysBack(n,ref){const d=ref?new Date(ref+'T12:00'):new Date();d.setDate(d.getDate()-n);return d.toISOString().split('T')[0];}
function last7(){const a=[];for(let i=6;i>=0;i--)a.push(daysBack(i,getDate()));return a;}
function last30(){const a=[];for(let i=29;i>=0;i--)a.push(daysBack(i,getDate()));return a;}
function last365(){const a=[];for(let i=364;i>=0;i--)a.push(daysBack(i,getDate()));return a;}
function effH(){return isPlaceholder?PH:habits;}
function effL(){return isPlaceholder?PHL:logs;}
function dayPct(date,hh,ll){const l=ll[date]||{};const done=hh.filter(h=>l[h.id]==='done').length;return hh.length>0?Math.round((done/hh.length)*100):null;}
function todayLabel(p){if(p===null)return'—';if(p>=80)return'Iron';if(p>=60)return'Solid';if(p>=40)return'Holding';return'Weak';}
function weekLabel(p){if(p===null)return'—';if(p>=80)return'Forged';if(p>=60)return'Steady';if(p>=40)return'Wavering';return'Broken';}
function calcStreak(){const hh=effH(),ll=effL();let s=0;const todayP=dayPct(getDate(),hh,ll);const startI=(todayP!==null&&todayP>=50)?0:1;for(let i=startI;i<=400;i++){const p=dayPct(daysBack(i,getDate()),hh,ll);if(p===null||p<50)break;s++;}return s;}
function calcHabitStreak(habitId){const ll=effL();let s=0;for(let i=1;i<=400;i++){const d=daysBack(i,getDate());if((ll[d]||{})[habitId]!=='done')break;s++;}return s;}
function getPersonalBests() {
  const hh = effH(), ll = effL();
  if (!hh.length) return { bestStreak: null, bestMonth: null, bestWeek: null };

  // Best all-time streak (≥50% completion days chained consecutively)
  let bestStreak = 0, cur = 0;
  const allDates = Object.keys(ll).sort();
  if (allDates.length) {
    let prev = null;
    allDates.forEach(d => {
      const pct = dayPct(d, hh, ll);
      if (pct !== null && pct >= 50) {
        if (prev) {
          const diff = (new Date(d) - new Date(prev)) / 86400000;
          cur = diff === 1 ? cur + 1 : 1;
        } else { cur = 1; }
        if (cur > bestStreak) bestStreak = cur;
        prev = d;
      } else { cur = 0; prev = null; }
    });
  }

  // Best elapsed full calendar month
  let bestMonth = null;
  const monthMap = {};
  Object.keys(ll).forEach(d => {
    const key = d.slice(0, 7); // "YYYY-MM"
    if (!monthMap[key]) monthMap[key] = [];
    monthMap[key].push(d);
  });
  const now = new Date();
  const curMonthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  Object.entries(monthMap).forEach(([key, dates]) => {
    if (key === curMonthKey) return; // skip current incomplete month
    const [y, m] = key.split('-').map(Number);
    const daysInMonth = new Date(y, m, 0).getDate();
    const pct = Math.round((dates.filter(d => dayPct(d, hh, ll) >= 50).length / daysInMonth) * 100);
    if (bestMonth === null || pct > bestMonth) bestMonth = pct;
  });

  // Best elapsed full Mon-Sun calendar week
  let bestWeek = null;
  const weekMap = {};
  Object.keys(ll).forEach(d => {
    const date = new Date(d + 'T12:00');
    const dow = (date.getDay() + 6) % 7; // Mon=0
    const mon = new Date(date); mon.setDate(date.getDate() - dow);
    const key = mon.toISOString().slice(0, 10);
    if (!weekMap[key]) weekMap[key] = [];
    weekMap[key].push(d);
  });
  const todayD = new Date();
  const todayDow = (todayD.getDay() + 6) % 7;
  const thisMon = new Date(todayD); thisMon.setDate(todayD.getDate() - todayDow);
  const thisMonKey = thisMon.toISOString().slice(0, 10);
  Object.entries(weekMap).forEach(([key, dates]) => {
    if (key === thisMonKey) return; // skip current incomplete week
    const pct = Math.round((dates.filter(d => dayPct(d, hh, ll) >= 50).length / 7) * 100);
    if (bestWeek === null || pct > bestWeek) bestWeek = pct;
  });

  return { bestStreak, bestMonth, bestWeek };
}
function getWeeklyBars() {
  const hh = effH(), ll = effL();
  const today = getDate();
  const days = [];
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  for (let i = 6; i >= 0; i--) {
    const d = daysBack(i, today);
    const pct = dayPct(d, hh, ll);
    const date = new Date(d + 'T12:00');
    days.push({ date: d, pct, label: dayNames[date.getDay()], isToday: d === today });
  }
  return days;
}
function getMonthOverMonth() {
  const hh = effH(), ll = effL();
  const now = new Date();
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function monthStats(year, month) { // month is 1-based
    const key = `${year}-${String(month).padStart(2,'0')}`;
    const daysInMonth = new Date(year, month, 0).getDate();
    let doneDays = 0;
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${key}-${String(d).padStart(2,'0')}`;
      const pct = dayPct(dateStr, hh, ll);
      if (pct !== null && pct >= 50) doneDays++;
    }
    const elapsed = year === now.getFullYear() && month === now.getMonth()+1
      ? now.getDate() : daysInMonth;
    const pct = elapsed > 0 ? Math.round((doneDays / elapsed) * 100) : 0;
    return { name: monthNames[month-1], pct: doneDays > 0 ? pct : null, elapsed, daysInMonth };
  }

  const curM = now.getMonth() + 1, curY = now.getFullYear();
  const prevM = curM === 1 ? 12 : curM - 1;
  const prevY = curM === 1 ? curY - 1 : curY;

  return { current: monthStats(curY, curM), previous: monthStats(prevY, prevM) };
}
function todayPct(){return dayPct(getDate(),effH(),effL());}
function weekPct(){const hh=effH(),ll=effL(),days=last7();let td=0;days.forEach(d=>{const l=ll[d]||{};hh.forEach(h=>{if(l[h.id]==='done')td++;});});return hh.length>0?Math.round((td/(hh.length*7))*100):null;}

function showToast(msg, sub) {
  const t = document.getElementById('toast');

  document.documentElement.style.setProperty('--hdr-h', hdrH + 'px');

function addRipple(btn, e) {
  const r = document.createElement('span');
  r.className = 'ripple';
  const sz = Math.max(btn.offsetWidth, btn.offsetHeight);
  r.style.width = r.style.height = sz + 'px';
  if (e) {
    const rect = btn.getBoundingClientRect();
    r.style.left = (e.clientX - rect.left - sz / 2) + 'px';
    r.style.top  = (e.clientY - rect.top  - sz / 2) + 'px';
  } else {
    r.style.left = r.style.top = '0';
  }
  btn.appendChild(r);
  setTimeout(() => r.remove(), 500);
}

  else hh.forEach((h,i)=>{mlist+=`<div class="manage-item card" data-id="${h.id}" style="animation-delay:${i*.04}s"><span class="drag-handle">&#9776;</span><div class="mi-meta"><div class="mi-name">${h.name}</div><div class="mi-cat">${getCatName(h.cat)}</div></div><button class="del-btn" onclick="delH('${h.id}')">&#10005;</button></div>`;});
  const catPills=cats.map(c=>`<div class="cat-pill-mgr"><span class="cat-pill-name">${c.name}</span><button class="cat-pill-edit" onclick="renameCat('${c.id}')">✏</button><button class="cat-pill-del"${cats.length<=1?' disabled style="opacity:.2"':''}${catHasHabits(c.id)?' disabled title="Remove disciplines first" style="opacity:.2"':''} onclick="deleteCat('${c.id}')">×</button></div>`).join('');
  return `<div class="shdr af s1"><span class="shdr-l">Categories</span><button class="sheet-done-btn" onclick="addCat()"${cats.length>=8?' disabled style="opacity:.3"':''}>+ Add</button></div>
  <div class="card af s2" style="padding:12px 14px;"><div class="cat-mgr-list">${catPills}</div>${cats.length>=8?'<div class="rpt-empty">Maximum 8 categories</div>':''}</div>
  <div class="shdr af s3"><span class="shdr-l">Forge a New Discipline</span></div>
  <div class="forge-form card af s4"><input id="fi" class="forge-input" placeholder="Name your discipline…" onkeydown="if(event.key==='Enter')addH()"><div class="cats">${cats.map(c=>`<button class="catpill${selCat===c.id?' sel':''}" data-c="${c.id}" onclick="selCatFn('${c.id}')">${c.name}</button>`).join('')}</div><button class="forge-btn" onclick="addH()">Forge Discipline</button></div>
  <div class="shdr af s5 mt6"><span class="shdr-l">Active (${hh.length})</span></div>
  <div class="manage-list">${mlist}</div>
  <button class="export-btn af s6" onclick="exportData()">↓ Export Record</button>
  <div class="ftr"><div class="ftr-logo">Gritcore</div><div class="ftr-sub">Build the person you intend to be</div></div>`;
}
/* ── Discipline Reorder (touch drag) ── */
let dragEl=null,dragClone=null,dragStartY=0,dragOffsetY=0;
let dragItems=[],dragIdx=-1;
function initReorder(){
  const list=document.querySelector('.manage-list');
  if(!list)return;
  list.addEventListener('touchstart',onDragStart,{passive:false});
  list.addEventListener('touchmove',onDragMove,{passive:false});
  list.addEventListener('touchend',onDragEnd);
}
function onDragStart(e){
  const handle=e.target.closest('.drag-handle');
  if(!handle)return;
  const item=handle.closest('.manage-item');
  if(!item)return;
  e.preventDefault();
  dragEl=item;
  dragItems=Array.from(item.parentElement.children);
  dragIdx=dragItems.indexOf(item);
  const touch=e.touches[0];
  const rect=item.getBoundingClientRect();
  dragStartY=touch.clientY;
  dragOffsetY=touch.clientY-rect.top;
  dragClone=item.cloneNode(true);
  dragClone.classList.add('drag-clone');
  dragClone.style.width=rect.width+'px';
  dragClone.style.top=rect.top+'px';
  dragClone.style.left=rect.left+'px';
  document.body.appendChild(dragClone);
  item.classList.add('drag-placeholder');
}
function onDragMove(e){
  if(!dragEl||!dragClone)return;
  e.preventDefault();
  const touch=e.touches[0];
  dragClone.style.top=(touch.clientY-dragOffsetY)+'px';
  const items=Array.from(dragEl.parentElement.children);
  for(let i=0;i<items.length;i++){
    if(items[i]===dragEl)continue;
    const rect=items[i].getBoundingClientRect();
    const mid=rect.top+rect.height/2;
    if(touch.clientY<mid&&i<items.indexOf(dragEl)){
      dragEl.parentElement.insertBefore(dragEl,items[i]);
      break;
    }else if(touch.clientY>mid&&i>items.indexOf(dragEl)){
      dragEl.parentElement.insertBefore(dragEl,items[i].nextSibling);
      break;
    }
  }
}
function onDragEnd(){
  if(!dragEl)return;
  const newOrder=Array.from(dragEl.parentElement.children).map(el=>el.dataset.id).filter(Boolean);
  if(newOrder.length===habits.length){
    const map={};habits.forEach(h=>map[h.id]=h);
    habits=newOrder.map(id=>map[id]).filter(Boolean);
    saveH();
  }
  dragEl.classList.remove('drag-placeholder');
  if(dragClone){dragClone.remove();dragClone=null;}
  dragEl=null;dragItems=[];dragIdx=-1;
}

function render(){
  const c=document.getElementById('content');
  if(view==='today')c.innerHTML=renderToday();
  else if(view==='record'){renderForgeRing();}
  else if(view==='report')renderReport();
  else if(view==='forge')c.innerHTML=renderForge();
  if(view==='forge')setTimeout(initReorder,0);
  updateHeader();
  setTimeout(()=>document.querySelectorAll('.cbar-fill[data-pct]').forEach(el=>{el.style.width=el.dataset.pct+'%';}),80);
}

/* FAB SHEET */
function openFabSheet(){
  const t=getDate(),tl=logs[t]||{};
  const list=document.getElementById('sheet-list');
  if(!habits.length||isPlaceholder){
    list.innerHTML='<div class="sheet-empty">No disciplines forged yet</div>';
  } else {
    list.innerHTML=habits.map(h=>{
      const done=tl[h.id]==='done';
      const failed=tl[h.id]==='failed';
      return `<div class="sheet-item${done?' ticked':failed?' failed':''}" id="si-${h.id}">
        <div class="sheet-item-meta">
          <div class="sheet-item-name">${h.name}</div>
          <div class="sheet-item-cat">${getCatName(h.cat)}</div>
        </div>
        <button class="sheet-tick" onclick="sheetTick('${h.id}',this)">
          ${done?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--heat)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':''}
        </button>
        <button class="sheet-fail" onclick="sheetFail('${h.id}',this)">
          ${failed?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(220,80,80,0.9)" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>':''}
        </button>
      </div>`;
    }).join('');
  }
  _updateSheetDone(tl);
  document.getElementById('fab-backdrop').classList.add('open');
  document.getElementById('fab-sheet').classList.add('open');
}
function closeFabSheet(){
  document.getElementById('fab-backdrop').classList.remove('open');
  document.getElementById('fab-sheet').classList.remove('open');
}
function _sheetAnimate(btn,cls){
  btn.classList.add(cls);
  setTimeout(()=>btn.classList.remove(cls),300);
}
function sheetTick(id,btn){
  const t=getDate();
  if(!logs[t])logs[t]={};
  logs[t][id]=logs[t][id]==='done'?null:'done';
  saveL();
  const item=document.getElementById('si-'+id);
  const isDone=logs[t][id]==='done';
  item.classList.toggle('ticked',isDone);
  item.classList.remove('failed');
  btn.innerHTML=isDone?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--heat)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':'';
  item.querySelector('.sheet-fail').innerHTML='';
  _sheetAnimate(btn,'stamp-done');
  const tl=logs[t]||{};
  updateHeat(habits.filter(h=>tl[h.id]==='done').length,habits.length);
  _updateSheetDone(tl);
  patchHabitCard(id,logs[t][id]);
  renderScores();updateHeader();
}
function sheetFail(id,btn){
  const t=getDate();
  if(!logs[t])logs[t]={};
  logs[t][id]=logs[t][id]==='failed'?null:'failed';
  saveL();
  const item=document.getElementById('si-'+id);
  const isFailed=logs[t][id]==='failed';
  item.classList.toggle('failed',isFailed);
  item.classList.remove('ticked');
  btn.innerHTML=isFailed?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(220,80,80,0.9)" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>':'';
  item.querySelector('.sheet-tick').innerHTML='';
  _sheetAnimate(btn,'stamp-fail');
  const tl=logs[t]||{};
  updateHeat(habits.filter(h=>tl[h.id]==='done').length,habits.length);
  _updateSheetDone(tl);
  patchHabitCard(id,logs[t][id]);
  renderScores();updateHeader();
}
function _updateSheetDone(tl){
  const anyDone=habits.some(h=>tl[h.id]==='done');
  const btn=document.getElementById('sheet-done');
  if(btn)btn.classList.toggle('visible',anyDone);
}

/* ── Dev Console ── */
let devConsoleOpen = false;

function toggleDevConsole() {
  devConsoleOpen ? closeDevConsole() : openDevConsole();
}
function openDevConsole() {
  devConsoleOpen = true;
  document.getElementById('dev-console-drawer').classList.add('open');
  document.getElementById('dev-console-backdrop').classList.add('open');
}
function closeDevConsole() {
  devConsoleOpen = false;
  document.getElementById('dev-console-drawer').classList.remove('open');
  document.getElementById('dev-console-backdrop').classList.remove('open');
}
function devDayPlus() {
  const cur = getDate();
  const d = new Date(cur + 'T12:00'); d.setDate(d.getDate() + 1);
  localStorage.setItem('gc:sim_date', d.toISOString().split('T')[0]);
  closeDevConsole(); render(); updateHeader();
}
function devDayMinus() {
  const cur = getDate();
  const d = new Date(cur + 'T12:00'); d.setDate(d.getDate() - 1);
  localStorage.setItem('gc:sim_date', d.toISOString().split('T')[0]);
  closeDevConsole(); render(); updateHeader();
}
function devAllDone() {
  const today = getDate(); const hh = effH();
  if (!logs[today]) logs[today] = {};
  hh.forEach(h => { logs[today][h.id] = 'done'; });
  saveL(); closeDevConsole(); render();
}
function devAllFailed() {
  const today = getDate(); const hh = effH();
  if (!logs[today]) logs[today] = {};
  hh.forEach(h => { logs[today][h.id] = 'failed'; });
  saveL(); closeDevConsole(); render();
}
function devSetStreak() {
  const n = parseInt(prompt('Set streak to how many days?'), 10);
  if (isNaN(n) || n < 1) return;
  const hh = effH(); if (!hh.length) { showToast('Add disciplines first'); return; }
  for (let i = 1; i <= n; i++) {
    const d = daysBack(i, getDate());
    if (!logs[d]) logs[d] = {};
    hh.forEach(h => { logs[d][h.id] = 'done'; });
  }
  saveL(); closeDevConsole(); render();
}
function devAddTestData() {
  const testHabits = [
    {id:'t1',name:'Cold Shower',cat:'c1',created:daysBack(30,getDate())},
    {id:'t2',name:'Meditation',cat:'c2',created:daysBack(30,getDate())},
    {id:'t3',name:'Deep Work',cat:'c3',created:daysBack(30,getDate())},
    {id:'t4',name:'Evening Reflection',cat:'c4',created:daysBack(30,getDate())},
    {id:'t5',name:'Exercise',cat:'c1',created:daysBack(20,getDate())},
  ];
  habits = testHabits; isPlaceholder = false;
  const testLogs = {};
  for (let i = 1; i <= 30; i++) {
    const d = daysBack(i, getDate());
    testLogs[d] = {};
    testHabits.forEach(h => {
      testLogs[d][h.id] = Math.random() > 0.25 ? 'done' : 'failed';
    });
  }
  logs = testLogs;
  saveH(); saveL(); closeDevConsole(); render();
  showToast('Test data added');
}
function devTriggerOnboarding() {
  if (!confirm('Re-trigger onboarding? App will reload.')) return;
  localStorage.removeItem('gc:onboarded');
  closeDevConsole();
  location.reload();
}
function devResetDate() {
  localStorage.removeItem('gc:sim_date');
  closeDevConsole(); render(); updateHeader();
}
function devResetAll() {
  habits=[];logs={};
  localStorage.removeItem('gc:gc1:habits');
  localStorage.removeItem('gc:gc1:logs');
  localStorage.removeItem('gc1:milestones');
  localStorage.removeItem('gc1:achievements');
  localStorage.removeItem('gc:sim_date');
  isPlaceholder=true;
  saveH();saveL();render();
  showToast('All data reset','Back to day zero');
}
