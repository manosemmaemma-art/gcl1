<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,date=no,email=no,address=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f0ece5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070605" media="(prefers-color-scheme: dark)">
<title>GritCore</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link href="fonts/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="gritcore-inline.css">
<link rel="stylesheet" href="gritcore.css">
</head>
<body>
<div id="app">
  <div id="heat-veil"></div>
  <div id="ambient-veil"></div>
  <div class="hdr" id="hdr">
    <div class="hdr-top">
      <div class="hdr-left"><button class="settings-btn btn-reset" onclick="openSettings()" aria-label="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ctd)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>
      <div class="hdr-logo-wrap"><div class="logo"><span class="logo-d">◆</span><span class="logo-g">GRIT</span><span class="logo-c">CORE</span></div><div class="logo-sub" id="logo-tagline">Forge your discipline.</div></div>
      <div class="hdr-right">
        <div class="sbadge" id="sbadge" role="button" tabindex="0" onclick="sw('today');setTimeout(()=>toggleStreakPanel(),100)" aria-label="Streak"><span class="sfire" id="sfire"><svg class="ember-svg" id="ember-svg" viewBox="0 0 10 14" fill="currentColor" width="10" height="14"><path d="M5 0C2.5 4 0 7 0 9.5A5 5 0 0 0 10 9.5C10 7 7.5 4 5 0Z" opacity="0.55"/><path d="M5 4C3.5 6.5 2.5 8.5 2.5 10a2.5 2.5 0 0 0 5 0C7.5 8.5 6.5 6.5 5 4Z"/></svg></span><span class="sbadge-inner"><span class="stxt" id="stxt">0</span><span class="stier" id="stier"></span></span></div>
      </div>
    </div>
  </div>
  <div class="content" id="content"></div>
  <div class="sheet-backdrop" id="fab-backdrop" role="button" tabindex="0" aria-label="Close" onclick="closeFabSheet()"></div>
  <div class="fab-sheet" id="fab-sheet" role="dialog" aria-modal="true" aria-label="Quick log disciplines" tabindex="-1">
    <div class="sheet-handle-zone" data-sheet="fab-sheet"><div class="sheet-handle"></div></div>
    <div class="sheet-header">
      <span class="sheet-title">Today</span>
      <span class="sheet-count" id="sheet-count"></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="sheet-progress-fill" style="width:0%"></div></div>
    <div class="sheet-list" id="sheet-list"></div>
    <button class="sheet-add" onclick="closeFabSheet();sw('forge',document.querySelector('[data-v=forge]'))">
      <div class="sheet-add-icon">+</div>
      <span class="sheet-add-label">Add a Discipline</span>
    </button>
  </div>
  <button class="fab" onclick="openFabSheet()"><span class="fab-icon">+</span></button>
  <nav class="bnav" aria-label="Main navigation">
    <button class="bni on" data-v="today" onclick="sw('today',this)" aria-label="Today" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="7.1" y2="7.1"/><line x1="16.9" y1="16.9" x2="19.1" y2="19.1"/><line x1="19.1" y1="4.9" x2="16.9" y2="7.1"/><line x1="7.1" y1="16.9" x2="4.9" y2="19.1"/></svg>
      <span class="bni-lbl">Today</span>
      <span class="bni-dot"></span>
    </button>
    <button class="bni" data-v="record" onclick="sw('record',this)" aria-label="Record">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="bni-lbl">Record</span>
      <span class="bni-dot"></span>
    </button>
    <button class="bni" data-v="report" onclick="sw('report',this)" aria-label="Report">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span class="bni-lbl">Report</span>
      <span class="bni-dot"></span>
    </button>
    <button class="bni" data-v="forge" onclick="sw('forge',this)" aria-label="Forge">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="8" width="20" height="4" rx="1"/><path d="M9 12l1 5h4l1-5"/><rect x="5" y="18" width="14" height="3" rx="1"/></svg>
      <span class="bni-lbl">Forge</span>
      <span class="bni-dot"></span>
    </button>
  </nav>
</div>
<div class="toast" id="toast" role="alert" aria-live="assertive" aria-atomic="true">
  <span class="toast-icon">✦</span>
  <div class="toast-body">
    <span class="toast-msg" id="toast-msg"></span>
    <span class="toast-sub" id="toast-sub"></span>
  </div>
</div>
<div id="ach-banner">
  <div class="ach-banner-icon" id="ach-icon"></div>
  <div class="ach-banner-body">
    <div class="ach-banner-tag">Achievement Unlocked</div>
    <div class="ach-banner-name" id="ach-name"></div>
    <div class="ach-banner-desc" id="ach-desc"></div>
  </div>
</div>

<div id="pd-overlay" class="pd-overlay" onclick="closePerfectDay()" role="presentation"></div>
<div id="pd-modal" class="pd-modal" role="dialog" aria-modal="true" aria-labelledby="pd-title" tabindex="-1">
  <div class="pd-icon">✦</div>
  <div class="pd-title" id="pd-title">Perfect Day</div>
  <div class="pd-sub">Every discipline. No exceptions.</div>
  <button class="pd-btn" onclick="closePerfectDay()">Continue</button>
</div>

<div id="wr-overlay" class="wr-overlay" onclick="closeWeeklyReport()" role="presentation"></div>
<div id="wr-modal" class="wr-modal" role="dialog" aria-modal="true" aria-label="Weekly Report" tabindex="-1">
  <div class="wr-panels" id="wr-panels"></div>
  <div class="wr-dots" id="wr-dots"></div>
</div>

<div id="settings-backdrop" class="sheet-backdrop" role="button" tabindex="0" aria-label="Close" onclick="closeSettings()" style="display:none"></div>
<div class="fab-sheet" id="settings-sheet" role="dialog" aria-modal="true" aria-label="Settings" tabindex="-1">
  <div class="sheet-handle-zone" data-sheet="settings-sheet"><div class="sheet-handle"></div></div>
  <div class="sheet-header">
    <span class="sheet-title">Settings</span>
  </div>
  <div class="settings-list" id="settings-list"></div>
</div>

<div id="rpt-sheet-backdrop" class="sheet-backdrop" role="button" tabindex="0" aria-label="Close" onclick="closeRptSheet()" style="display:none"></div>
<div class="fab-sheet" id="rpt-sheet" role="dialog" aria-modal="true" aria-label="Details" tabindex="-1">
  <div class="sheet-handle-zone" data-sheet="rpt-sheet"><div class="sheet-handle"></div></div>
  <div id="rpt-sheet-content"></div>
</div>

<script src="config.js"></script>
<script src="paywall.js"></script>
<script src="notifications.js"></script>
<script src="gritcore.js"></script>

<!-- Dev Console -->
<button class="dev-console-btn" id="dev-console-btn" onclick="toggleDevConsole()" style="display:none">⚙</button>
<div class="sheet-backdrop dev-console-backdrop" id="dev-console-backdrop" role="button" tabindex="0" aria-label="Close" onclick="closeDevConsole()"></div>
<div class="dev-console-drawer" id="dev-console-drawer">
  <div class="sheet-handle-zone" data-sheet="dev-console-drawer"><div class="sheet-handle"></div></div>
  <div class="dev-console-title">Dev Console</div>
  <div class="dev-console-grid">
    <button class="dev-btn" onclick="devDayPlus()">+1 Day</button>
    <button class="dev-btn" onclick="devDayMinus()">−1 Day</button>
    <button class="dev-btn" onclick="devAllDone()">All Done ✓</button>
    <button class="dev-btn" onclick="devAllFailed()">All Failed ✗</button>
    <button class="dev-btn" onclick="devSetStreak()">Set Streak…</button>
    <button class="dev-btn" onclick="devAddTestData()">Add Test Data</button>
    <button class="dev-btn" onclick="devTriggerOnboarding()">Onboarding</button>
    <button class="dev-btn" onclick="devResetDate()">Reset Date</button>
    <button class="dev-btn dev-btn-danger" style="grid-column: span 2;" onclick="devResetAll()">Reset All</button>
  </div>
</div>
<div class="combo-badge" id="combo-badge"><div class="combo-num" id="combo-num">x2</div><div class="combo-lbl">COMBO</div></div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
